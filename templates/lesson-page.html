<!DOCTYPE html>
<!--
教学页模板。复制到目标目录的 可视化/ 下改名使用，只改标题、图、steps 与字段。
必须保留：meta note、快动画、图旁的字段表（不要改成跟随浮层）；页面用 file:// 打开，不用热更新。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="note" content="一句话说明这一页只讲什么。">
<title>这一页的主题</title>
<style>
  :root { --ink:#1b1f24; --muted:#6b7280; --line:#c8ced6; --g:#2e9e5b; --b:#2f6fd0; --p:#7b4bd8; --bg:#fbfbf9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.6 -apple-system,"PingFang SC","Helvetica Neue",sans-serif; }
  .wrap { max-width:1120px; margin:0 auto; padding:24px 22px 40px; }
  h1 { font-size:22px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:8px; }
  .stage { display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap; }
  .stage svg { flex:1 1 620px; min-width:400px; height:auto; display:block; }
  .side { flex:0 0 300px; }
  .side .cap { color:#9aa3ad; font-size:12.5px; margin:0 0 6px; }
  .side table { border-collapse:collapse; width:100%; font-size:13.5px; }
  .side th, .side td { border:1px solid #e5e8ec; padding:7px 9px; text-align:left; }
  .side th { background:#f5f6f8; font-weight:600; width:92px; color:#4b5563; }
  .side td { font-family:ui-monospace,Menlo,monospace; }
  .side td.chg { background:#f3ecff; color:var(--p); font-weight:600; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:10px 0 0; }
  button { font:inherit; font-size:14px; padding:7px 14px; border-radius:8px;
           border:1px solid var(--line); background:#fff; cursor:pointer; }
  button:hover { background:#f2f4f7; }
  #msg { flex-basis:100%; font-size:15px; min-height:24px; color:#374151; }
  #step { color:var(--muted); font-size:13px; }
  .terms { margin-top:12px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .tlabel { color:#9aa3ad; font-size:12.5px; }
  .tchip { font-size:13px; padding:4px 10px; border-radius:999px; border:1px solid #d6dbe2; background:#fff; cursor:pointer; }
  .tchip:hover { background:#f6f7fb; border-color:var(--p); }
  .tdef { flex-basis:100%; font-size:13.5px; color:#374151; background:#f8f7ff; border:1px solid #e4defb; border-radius:8px; padding:7px 11px; }
  .flash { animation: fl .22s ease; }
  .glow { filter: drop-shadow(0 0 7px #8b7bd8) brightness(1.03); }
  @keyframes fl { from { opacity:.35 } to { opacity:1 } }
</style>
</head>
<body>
<div class="wrap">
  <h1>这一页的主题</h1>
  <div class="sub">一句背景，不超过一行。</div>

  <div class="stage">
    <svg viewBox="0 0 760 400">
      <!-- 节点：左/中/右，只画形状与名字 -->
      <rect x="20" y="230" width="170" height="92" rx="10" fill="#f7fbf8" stroke="#2e9e5b" stroke-width="2"/>
      <text x="105" y="282" text-anchor="middle" font-size="15">起点</text>

      <rect id="mid" x="235" y="84" width="310" height="270" rx="12" fill="#f7f8fb" stroke="#8b7bd8" stroke-width="2"/>
      <text x="390" y="110" text-anchor="middle" font-size="15">中间设备</text>

      <rect x="570" y="230" width="170" height="92" rx="10" fill="#f6f9ff" stroke="#2f6fd0" stroke-width="2"/>
      <text x="655" y="282" text-anchor="middle" font-size="15">终点</text>

      <line x1="190" y1="270" x2="235" y2="200" stroke="#9aa3ad" stroke-width="2"/>
      <line x1="545" y1="200" x2="570" y2="270" stroke="#9aa3ad" stroke-width="2"/>

      <!-- 移动的只有一个点，不要带浮动卡片 -->
      <circle id="dot" cx="105" cy="276" r="9" fill="#e8853a" stroke="#b45c1a" stroke-width="2"/>
    </svg>

    <!-- 字段表：固定在图旁，不在图上飘 -->
    <div class="side">
      <div class="cap">当前字段</div>
      <table>
        <tr><th>字段一</th><td id="f1">初始值</td></tr>
        <tr><th>字段二</th><td id="f2">初始值</td></tr>
        <tr><th>字段三</th><td id="f3">初始值</td></tr>
      </table>
    </div>
  </div>

  <div class="bar">
    <button id="prev">上一步</button>
    <button id="next">下一步</button>
    <button id="reset">从头</button>
    <span id="step">第 0 步 / 共 3 步</span>
    <span id="msg">第一步在讲什么。</span>
  </div>

  <div class="terms">
    <span class="tlabel">本步术语</span>
    <span id="tchips"></span>
    <div id="tdef" class="tdef" hidden></div>
  </div>
</div>

<script>
// 每步：位置、字段值、要说的一句话（25 字内）
const steps = [
  { pos:[105,276], f1:'A', f2:'B', f3:'C', msg:'第一步在讲什么。' },
  { pos:[390,220], f1:'A', f2:'B2', f3:'C', msg:'第二步发生了什么。' },
  { pos:[655,276], f1:'A', f2:'B2', f3:'C3', msg:'第三步结论。' },
];
const STEP_TERMS = [['术语一'], ['术语一', '术语二'], ['术语二']];

const TERM_CACHE = {};
fetch('术语.json').then(r => r.json()).then(d => {
  (d.terms || []).forEach(t => { TERM_CACHE[t.abbr] = t; TERM_CACHE[t.cn] = t; });
  drawTerms(i);
}).catch(() => {});

let i = 0, px = steps[0].pos[0], py = steps[0].pos[1];
const dot = document.getElementById('dot');
const msg = document.getElementById('msg');
const stepLabel = document.getElementById('step');
const tchips = document.getElementById('tchips');
const tdef = document.getElementById('tdef');

function drawTerms(n) {
  tchips.innerHTML = '';
  tdef.hidden = true;
  (STEP_TERMS[n] || []).forEach(k => {
    const t = TERM_CACHE[k];
    if (!t) return;
    const b = document.createElement('button');
    b.className = 'tchip';
    b.textContent = k;
    const head = [t.abbr, t.full, t.cn].filter(Boolean).join('｜');
    b.onclick = () => { tdef.hidden = false; tdef.textContent = head + '：' + t.note; };
    tchips.appendChild(b);
  });
}

function moveTo(x, y, ms) {
  if (!ms) { px = x; py = y; dot.setAttribute('cx', x); dot.setAttribute('cy', y); return Promise.resolve(); }
  return new Promise(res => {
    const x0 = px, y0 = py, t0 = performance.now();
    function frame(t) {
      const k = Math.min(1, (t - t0) / ms);
      const e = k < .5 ? 2*k*k : -1 + (4 - 2*k)*k;
      px = x0 + (x - x0) * e;
      py = y0 + (y - y0) * e;
      dot.setAttribute('cx', px);
      dot.setAttribute('cy', py);
      if (k < 1) requestAnimationFrame(frame); else res();
    }
    requestAnimationFrame(frame);
  });
}

function setField(id, text, changed) {
  const td = document.getElementById(id);
  if (td.textContent !== text) {
    td.textContent = text;
    td.classList.remove('flash');
    void td.offsetWidth;
    td.classList.add('flash');
  }
  td.classList.toggle('chg', !!changed);
}

async function go(n) {
  i = Math.max(0, Math.min(steps.length - 1, n));
  const s = steps[i], prev = steps[i - 1] || {};
  await moveTo(s.pos[0], s.pos[1], i === 0 ? 0 : 300);
  ['f1', 'f2', 'f3'].forEach(k => setField(k, s[k], prev[k] !== undefined && prev[k] !== s[k]));
  msg.textContent = s.msg;
  stepLabel.textContent = `第 ${i} 步 / 共 ${steps.length - 1} 步`;
  drawTerms(i);
}

document.getElementById('next').addEventListener('click', () => go(i + 1));
document.getElementById('prev').addEventListener('click', () => go(i - 1));
document.getElementById('reset').addEventListener('click', () => go(0));

// ?step=N：无交互直达某一步，用于 --dump-dom 断言
go(0);
const _m = location.search.match(/step=(\d)/);
if (_m) {
  const n = Math.max(0, Math.min(steps.length - 1, +_m[1]));
  px = steps[n].pos[0]; py = steps[n].pos[1];
  dot.setAttribute('cx', px); dot.setAttribute('cy', py);
  ['f1','f2','f3'].forEach(k => { const td = document.getElementById(k); td.textContent = steps[n][k]; });
  msg.textContent = steps[n].msg;
  stepLabel.textContent = `第 ${n} 步 / 共 ${steps.length - 1} 步`;
  i = n;
}
</script>
<script src="术语.js"></script>
</body>
</html>
